  <!-- Python Code Snippet Lines -->
  <g transform="translate(65, 95)" font-size="12">
    <text x="0" y="0" fill="#484F58">01</text>
    <text x="35" y="0" fill="#FF7B72">import</text> <text x="85" y="0" fill="#FFA657">asyncio, aiohttp, time</text>

    <text x="0" y="22" fill="#484F58">02</text>
    <text x="35" y="22" fill="#FF7B72">from</text> <text x="75" y="22" fill="#79C0FF">magicfinger_engine</text> <text x="220" y="22" fill="#FF7B72">import</text> <text x="270" y="22" fill="#FFA657">UltraProxyPool, DiscordWebhook</text>

    <text x="0" y="44" fill="#484F58">03</text>

    <text x="0" y="66" fill="#484F58">04</text>
    <text x="35" y="66" fill="#FF7B72">async def</text> <text x="110" y="66" fill="#D2A8FF">execute_sniper_checkout</text><text x="285" y="66" fill="#E6EDF3">(target_sku, proxy_node):</text>

    <text x="0" y="88" fill="#484F58">05</text>
    <text x="55" y="88" fill="#79C0FF">t_start</text> <text x="115" y="88" fill="#FF7B72">=</text> <text x="135" y="88" fill="#79C0FF">time.perf_counter()</text>

    <text x="0" y="110" fill="#484F58">06</text>
    <text x="55" y="110" fill="#79C0FF">payload</text> <text x="115" y="110" fill="#FF7B72">=</text> <text x="135" y="110" fill="#A5D6FF">{"sku": target_sku, "qty": 1, "auto_sign": True}</text>

    <text x="0" y="132" fill="#484F58">07</text>
    <text x="55" y="132" fill="#FF7B72">async with</text> <text x="140" y="132" fill="#79C0FF">aiohttp.ClientSession(proxy=proxy_node) as</text> <text x="475" y="132" fill="#E6EDF3">session:</text>

    <text x="0" y="154" fill="#484F58">08</text>
    <text x="75" y="154" fill="#FF7B72">async with</text> <text x="160" y="154" fill="#79C0FF">session.post(API_ENDPOINT, json=payload) as</text> <text x="485" y="154" fill="#E6EDF3">resp:</text>

    <text x="0" y="176" fill="#484F58">09</text>
    <text x="95" y="176" fill="#FF7B72">if</text> <text x="115" y="176" fill="#79C0FF">resp.status</text> <text x="200" y="176" fill="#FF7B72">==</text> <text x="220" y="176" fill="#79C0FF">200:</text>

    <text x="0" y="198" fill="#484F58">10</text>
    <text x="115" y="198" fill="#79C0FF">latency_ms</text> <text x="195" y="198" fill="#FF7B72">=</text> <text x="215" y="198" fill="#79C0FF">(time.perf_counter() - t_start) * 1000</text>

    <text x="0" y="220" fill="#484F58">11</text>
    <text x="115" y="220" fill="#FF7B72">await</text> <text x="160" y="220" fill="#79C0FF">DiscordWebhook.dispatch_success(target_sku, latency_ms)</text>

    <text x="0" y="242" fill="#484F58">12</text>
    <text x="115" y="242" fill="#FF7B72">return</text> <text x="165" y="242" fill="#A5D6FF">{"status": "COPPED", "speed": f"{latency_ms:.1f}ms"}</text>
  </g>

