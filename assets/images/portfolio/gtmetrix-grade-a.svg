<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
      <defs>
        <linearGradient id="gtGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#141B26"/>
          <stop offset="100%" stop-color="#0B0F16"/>
        </linearGradient>
      </defs>
      <rect width="1200" height="800" fill="url(#gtGrad)"/>
      <rect width="1200" height="54" fill="#1D2635"/>
      <text x="30" y="35" font-family="sans-serif" font-size="20" font-weight="900" fill="#FFF"><tspan fill="#F5A623">GT</tspan>metrix</text>
      <rect x="150" y="12" width="700" height="30" rx="4" fill="#0D121A" stroke="#2D3B52"/>
      <text x="170" y="32" font-family="monospace" font-size="13" fill="#8EA1B9">https://api.vortex-saas.io/production-edge</text>

      <g transform="translate(60, 85)">
        <text x="0" y="24" font-family="sans-serif" font-size="24" font-weight="800" fill="#FFF">Latest Performance Report for: https://api.vortex-saas.io</text>
        <text x="0" y="50" font-family="sans-serif" font-size="13" fill="#8EA1B9">Report generated: Today • Test Server Location: Vancouver, Canada (Edge CDN)</text>

        <!-- Main Grade Box -->
        <g transform="translate(0, 80)">
          <rect width="1080" height="160" rx="8" fill="#172230" stroke="#2C3D56"/>
          
          <!-- Grade A Badge -->
          <g transform="translate(50, 25)">
            <polygon points="55,0 110,32 110,95 55,127 0,95 0,32" fill="#00A65A"/>
            <text x="55" y="76" font-family="sans-serif" font-size="56" font-weight="900" fill="#FFF" text-anchor="middle">A</text>
          </g>

          <g transform="translate(200, 45)">
            <text x="0" y="20" font-family="sans-serif" font-size="13" fill="#8EA1B9">GTmetrix Grade</text>
            <text x="0" y="60" font-family="sans-serif" font-size="32" font-weight="800" fill="#00A65A">Grade A</text>
          </g>

          <g transform="translate(420, 45)">
            <text x="0" y="20" font-family="sans-serif" font-size="13" fill="#8EA1B9">Performance</text>
            <text x="0" y="60" font-family="JetBrains Mono, monospace" font-size="34" font-weight="800" fill="#00A65A">100%</text>
          </g>

          <g transform="translate(640, 45)">
            <text x="0" y="20" font-family="sans-serif" font-size="13" fill="#8EA1B9">Structure</text>
            <text x="0" y="60" font-family="JetBrains Mono, monospace" font-size="34" font-weight="800" fill="#00A65A">99%</text>
          </g>

          <g transform="translate(860, 45)">
            <text x="0" y="20" font-family="sans-serif" font-size="13" fill="#8EA1B9">LCP / TBT</text>
            <text x="0" y="60" font-family="JetBrains Mono, monospace" font-size="28" font-weight="800" fill="#00A65A">412ms / 0ms</text>
          </g>
        </g>

        <!-- Speed Visualization Breakdown -->
        <g transform="translate(0, 270)">
          <rect width="1080" height="320" rx="8" fill="#121B27" stroke="#25354C"/>
          <text x="30" y="38" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFF">Speed Visualization &amp; Server Timings</text>
          
          <g transform="translate(30, 70)" font-family="JetBrains Mono, monospace" font-size="14">
            <text x="0" y="25" fill="#8EA1B9">TTFB (Time to First Byte):</text>
            <text x="320" y="25" font-weight="700" fill="#00A65A">84 ms (Edge Cache HIT)</text>

            <text x="0" y="70" fill="#8EA1B9">First Contentful Paint:</text>
            <text x="320" y="70" font-weight="700" fill="#00A65A">210 ms</text>

            <text x="0" y="115" fill="#8EA1B9">Fully Loaded Time:</text>
            <text x="320" y="115" font-weight="700" fill="#00A65A">0.58 s</text>

            <text x="0" y="160" fill="#8EA1B9">Total Page Size / Requests:</text>
            <text x="320" y="160" font-weight="700" fill="#FFF">184 KB / 14 Requests (HTTP/3)</text>
          </g>
        </g>
      </g>
    </svg>