<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
      <defs>
        <linearGradient id="psGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1B1F27"/>
          <stop offset="100%" stop-color="#0F1217"/>
        </linearGradient>
        <filter id="psGlow">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feComposite in="SourceGraphic" in2="b" operator="over"/>
        </filter>
      </defs>
      
      <!-- Background -->
      <rect width="1200" height="800" fill="url(#psGrad)"/>
      
      <!-- Top Chrome -->
      <rect width="1200" height="52" fill="#232834"/>
      <circle cx="25" cy="26" r="6.5" fill="#FF5F56"/>
      <circle cx="45" cy="26" r="6.5" fill="#FFBD2E"/>
      <circle cx="65" cy="26" r="6.5" fill="#27C93F"/>
      
      <rect x="110" y="11" width="760" height="30" rx="6" fill="#13161D" stroke="#31394A"/>
      <text x="130" y="31" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#8B949E">🔒 https://pagespeed.web.dev/analysis?url=https%3A%2F%2Fclientstore-prod.com</text>

      <rect x="890" y="11" width="130" height="30" rx="6" fill="#0CCE6B"/>
      <text x="955" y="31" font-family="sans-serif" font-size="12" font-weight="700" fill="#0E1217" text-anchor="middle">📱 Mobile (100)</text>

      <rect x="1035" y="11" width="130" height="30" rx="6" fill="#1A1E27"/>
      <text x="1100" y="31" font-family="sans-serif" font-size="12" fill="#8B949E" text-anchor="middle">💻 Desktop (100)</text>

      <!-- Main Content -->
      <g transform="translate(60, 75)">
        <text x="0" y="24" font-family="sans-serif" font-size="24" font-weight="800" fill="#FFF">PageSpeed Insights</text>
        <text x="0" y="50" font-family="sans-serif" font-size="13" fill="#8B949E">Tested on Mobile • Lighthouse 11.4 Engine • Real-User Experience Data</text>

        <!-- Passed Box -->
        <rect x="700" y="0" width="380" height="46" rx="8" fill="#102E1B" stroke="#0CCE6B" stroke-width="1.5"/>
        <circle cx="725" cy="23" r="8" fill="#0CCE6B"/>
        <text x="748" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#0CCE6B">Core Web Vitals Assessment: PASSED ✓</text>

        <!-- 4 Score Rings -->
        <g transform="translate(0, 90)">
          <!-- Performance -->
          <g transform="translate(60, 0)">
            <circle cx="55" cy="55" r="50" fill="none" stroke="#163821" stroke-width="9"/>
            <circle cx="55" cy="55" r="50" fill="none" stroke="#0CCE6B" stroke-width="9" stroke-dasharray="314" stroke-dashoffset="0" filter="url(#psGlow)"/>
            <text x="55" y="66" font-family="JetBrains Mono, monospace" font-size="34" font-weight="900" fill="#0CCE6B" text-anchor="middle">100</text>
            <text x="55" y="132" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">Performance</text>
          </g>

          <!-- Accessibility -->
          <g transform="translate(320, 0)">
            <circle cx="55" cy="55" r="50" fill="none" stroke="#163821" stroke-width="9"/>
            <circle cx="55" cy="55" r="50" fill="none" stroke="#0CCE6B" stroke-width="9" stroke-dasharray="314" stroke-dashoffset="0"/>
            <text x="55" y="66" font-family="JetBrains Mono, monospace" font-size="34" font-weight="900" fill="#0CCE6B" text-anchor="middle">100</text>
            <text x="55" y="132" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">Accessibility</text>
          </g>

          <!-- Best Practices -->
          <g transform="translate(580, 0)">
            <circle cx="55" cy="55" r="50" fill="none" stroke="#163821" stroke-width="9"/>
            <circle cx="55" cy="55" r="50" fill="none" stroke="#0CCE6B" stroke-width="9" stroke-dasharray="314" stroke-dashoffset="0"/>
            <text x="55" y="66" font-family="JetBrains Mono, monospace" font-size="34" font-weight="900" fill="#0CCE6B" text-anchor="middle">100</text>
            <text x="55" y="132" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">Best Practices</text>
          </g>

          <!-- SEO -->
          <g transform="translate(840, 0)">
            <circle cx="55" cy="55" r="50" fill="none" stroke="#163821" stroke-width="9"/>
            <circle cx="55" cy="55" r="50" fill="none" stroke="#0CCE6B" stroke-width="9" stroke-dasharray="314" stroke-dashoffset="0"/>
            <text x="55" y="66" font-family="JetBrains Mono, monospace" font-size="34" font-weight="900" fill="#0CCE6B" text-anchor="middle">100</text>
            <text x="55" y="132" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">SEO</text>
          </g>
        </g>

        <!-- Metric Details Grid -->
        <g transform="translate(0, 270)">
          <rect x="0" y="0" width="520" height="74" rx="8" fill="#151A22" stroke="#2A3344"/>
          <circle cx="30" cy="37" r="6" fill="#0CCE6B"/>
          <text x="50" y="32" font-family="sans-serif" font-size="13" fill="#8B949E">First Contentful Paint (FCP)</text>
          <text x="50" y="56" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" fill="#0CCE6B">0.4 s</text>
          <text x="490" y="44" font-family="sans-serif" font-size="12" font-weight="700" fill="#0CCE6B" text-anchor="end">Good ✓</text>

          <rect x="560" y="0" width="520" height="74" rx="8" fill="#151A22" stroke="#2A3344"/>
          <circle cx="590" cy="37" r="6" fill="#0CCE6B"/>
          <text x="610" y="32" font-family="sans-serif" font-size="13" fill="#8B949E">Largest Contentful Paint (LCP)</text>
          <text x="610" y="56" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" fill="#0CCE6B">0.7 s</text>
          <text x="1050" y="44" font-family="sans-serif" font-size="12" font-weight="700" fill="#0CCE6B" text-anchor="end">Good ✓</text>

          <rect x="0" y="90" width="520" height="74" rx="8" fill="#151A22" stroke="#2A3344"/>
          <circle cx="30" cy="127" r="6" fill="#0CCE6B"/>
          <text x="50" y="122" font-family="sans-serif" font-size="13" fill="#8B949E">Total Blocking Time (TBT)</text>
          <text x="50" y="146" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" fill="#0CCE6B">0 ms</text>
          <text x="490" y="134" font-family="sans-serif" font-size="12" font-weight="700" fill="#0CCE6B" text-anchor="end">Optimal ✓</text>

          <rect x="560" y="90" width="520" height="74" rx="8" fill="#151A22" stroke="#2A3344"/>
          <circle cx="590" cy="127" r="6" fill="#0CCE6B"/>
          <text x="610" y="122" font-family="sans-serif" font-size="13" fill="#8B949E">Cumulative Layout Shift (CLS)</text>
          <text x="610" y="146" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" fill="#0CCE6B">0.000</text>
          <text x="1050" y="134" font-family="sans-serif" font-size="12" font-weight="700" fill="#0CCE6B" text-anchor="end">Zero Shift ✓</text>
        </g>
      </g>
    </svg>