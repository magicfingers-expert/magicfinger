<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" style="background:#0F1117;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161922" />
      <stop offset="100%" stop-color="#1C202B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7941D" />
      <stop offset="100%" stop-color="#F5A623" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1E29" />
      <stop offset="100%" stop-color="#141720" />
    </linearGradient>
  </defs>

  <!-- Browser Header Bar -->
  <rect x="0" y="0" width="1200" height="42" fill="#12141A" />
  <circle cx="22" cy="21" r="6" fill="#FF5F56" />
  <circle cx="42" cy="21" r="6" fill="#FFBD2E" />
  <circle cx="62" cy="21" r="6" fill="#27C93F" />
  
  <!-- URL Bar -->
  <rect x="180" y="8" width="840" height="26" rx="5" fill="#1C202B" stroke="#2D3345" stroke-width="1" />
  <text x="200" y="25" fill="#8B949E" font-size="12" font-family="monospace">https://admin.shopify.com/store/magicfinger-luxury-apparel/analytics</text>
  <rect x="940" y="12" width="65" height="18" rx="3" fill="#0CCE6B" fill-opacity="0.15" stroke="#0CCE6B" stroke-width="0.8" />
  <text x="947" y="25" fill="#0CCE6B" font-size="10" font-weight="bold">SSL 200 OK</text>

  <!-- App Header -->
  <rect x="0" y="42" width="1200" height="60" fill="url(#headerGrad)" stroke="#252A38" stroke-width="1" />
  
  <!-- Logo & Store Switcher -->
  <rect x="25" y="54" width="36" height="36" rx="6" fill="#F7941D" />
  <path d="M43 60 L33 66 L33 78 L43 84 L53 78 L53 66 Z" fill="#FFFFFF" fill-opacity="0.9" />
  <text x="75" y="71" fill="#FFFFFF" font-size="15" font-weight="bold">AURA STUDIO APPAREL</text>
  <text x="75" y="86" fill="#8B949E" font-size="11">Shopify Plus Enterprise • US-East Storefront</text>

  <!-- Live Sales Alert -->
  <rect x="960" y="55" width="215" height="34" rx="6" fill="#1F2533" stroke="#0CCE6B" stroke-width="1" />
  <circle cx="978" cy="72" r="4" fill="#0CCE6B" />
  <text x="990" y="76" fill="#FFFFFF" font-size="12" font-weight="600">Live: 142 Active Shoppers</text>

  <!-- Left Navigation Sidebar -->
  <rect x="0" y="102" width="220" height="648" fill="#12141A" stroke="#202533" stroke-width="1" />
  
  <!-- Nav Items -->
  <g transform="translate(18, 125)">
    <rect x="0" y="0" width="184" height="36" rx="6" fill="#F7941D" fill-opacity="0.15" stroke="#F7941D" stroke-width="1" />
    <text x="35" y="23" fill="#F7941D" font-size="13" font-weight="bold">Live Analytics</text>
    
    <text x="35" y="65" fill="#9BA3AF" font-size="13">Orders &amp; Drafts</text>
    <text x="150" y="65" fill="#0CCE6B" font-size="11" font-weight="bold">+18</text>
    
    <text x="35" y="105" fill="#9BA3AF" font-size="13">Products (1,240)</text>
    <text x="35" y="145" fill="#9BA3AF" font-size="13">Customers</text>
    <text x="35" y="185" fill="#9BA3AF" font-size="13">Theme Editor (Next.js)</text>
    <text x="35" y="225" fill="#9BA3AF" font-size="13">Discounts &amp; Promos</text>
    <text x="35" y="265" fill="#9BA3AF" font-size="13">Custom Apps</text>
    <text x="35" y="305" fill="#9BA3AF" font-size="13">Settings &amp; Webhooks</text>
