    <line x1="20" y1="230" x2="550" y2="230" stroke="#252B3A" stroke-dasharray="3,3" />
    <line x1="20" y1="280" x2="550" y2="280" stroke="#252B3A" stroke-dasharray="3,3" />
    <line x1="20" y1="330" x2="550" y2="330" stroke="#252B3A" stroke-width="1" />
    
    <!-- Chart Polygon & Line -->
    <polygon points="20,330 60,310 110,290 160,305 210,260 260,240 310,210 360,230 410,180 460,165 510,140 550,130 550,330 20,330" fill="url(#goldGrad)" fill-opacity="0.18" />
    <polyline points="20,330 60,310 110,290 160,305 210,260 260,240 310,210 360,230 410,180 460,165 510,140 550,130" fill="none" stroke="#F7941D" stroke-width="3" />
    
    <!-- Point Highlights -->
    <circle cx="510" cy="140" r="5" fill="#FDE8B3" stroke="#F7941D" stroke-width="2" />
    <text x="475" y="125" fill="#FDE8B3" font-size="11" font-weight="bold">$1,850/hr</text>
    
    <text x="20" y="355" fill="#8B949E" font-size="10">00:00</text>
    <text x="140" y="355" fill="#8B949E" font-size="10">06:00</text>
    <text x="280" y="355" fill="#8B949E" font-size="10">12:00</text>
    <text x="420" y="355" fill="#8B949E" font-size="10">18:00</text>
    <text x="525" y="355" fill="#8B949E" font-size="10">NOW</text>

    <!-- Recent Real Orders Table -->
    <rect x="590" y="120" width="340" height="270" rx="8" fill="url(#cardGrad)" stroke="#252B3A" stroke-width="1" />
    <text x="610" y="148" fill="#FFFFFF" font-size="14" font-weight="bold">Recent High-Value Orders</text>
    
    <!-- Order 1 -->
    <rect x="605" y="165" width="310" height="42" rx="4" fill="#141720" />
    <text x="615" y="185" fill="#FFFFFF" font-size="12" font-weight="bold">#10892 - Ethan Cole</text>
    <text x="615" y="198" fill="#8B949E" font-size="10">2 items • 1 min ago • Stripe Express</text>
    <text x="855" y="190" fill="#0CCE6B" font-size="13" font-weight="bold">$248.00</text>

    <!-- Order 2 -->
    <rect x="605" y="215" width="310" height="42" rx="4" fill="#141720" />
    <text x="615" y="235" fill="#FFFFFF" font-size="12" font-weight="bold">#10891 - Sophia Zhang</text>
    <text x="615" y="248" fill="#8B949E" font-size="10">3 items • 4 mins ago • Apple Pay</text>
    <text x="855" y="240" fill="#0CCE6B" font-size="13" font-weight="bold">$395.50</text>

    <!-- Order 3 -->
    <rect x="605" y="265" width="310" height="42" rx="4" fill="#141720" />
    <text x="615" y="285" fill="#FFFFFF" font-size="12" font-weight="bold">#10890 - Marcus Ray</text>
    <text x="615" y="298" fill="#8B949E" font-size="10">1 item • 9 mins ago • Shop Pay</text>
    <text x="855" y="290" fill="#0CCE6B" font-size="13" font-weight="bold">$189.00</text>

    <!-- Order 4 -->
    <rect x="605" y="315" width="310" height="42" rx="4" fill="#141720" />
    <text x="615" y="335" fill="#FFFFFF" font-size="12" font-weight="bold">#10889 - Clara Dupont</text>
    <text x="615" y="348" fill="#8B949E" font-size="10">4 items • 14 mins ago • Klarna</text>
    <text x="855" y="340" fill="#0CCE6B" font-size="13" font-weight="bold">$520.00</text>

    <!-- Bottom Architecture Badge -->
    <rect x="0" y="410" width="930" height="60" rx="8" fill="#19202E" stroke="#F7941D" stroke-width="1" />
    <text x="20" y="435" fill="#FDE8B3" font-size="13" font-weight="bold">DEVELOPED BY MAGIC FINGER STUDIO</text>
    <text x="20" y="455" fill="#8B949E" font-size="11">Tech Stack: Shopify Plus Liquid Engine • Next.js 14 Headless Framework • Redis Session Storage • Sub-second Checkout</text>
    <rect x="800" y="423" width="115" height="32" rx="4" fill="#F7941D" />
    <text x="815" y="443" fill="#12141A" font-size="11" font-weight="bold">PRODUCTION LIVE</text>
  </g>
</svg>
