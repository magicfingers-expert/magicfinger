    <text x="18" y="28" fill="#8B949E" font-size="12">Total Sales (Today)</text>
    <text x="18" y="62" fill="#FFFFFF" font-size="24" font-weight="bold">$18,492.50</text>
    <text x="18" y="85" fill="#0CCE6B" font-size="11" font-weight="bold">↑ +28.4% vs yesterday</text>

    <!-- KPI 2 -->
    <rect x="235" y="0" width="215" height="100" rx="8" fill="url(#cardGrad)" stroke="#252B3A" stroke-width="1" />
    <text x="253" y="28" fill="#8B949E" font-size="12">Monthly Revenue (MRR)</text>
    <text x="253" y="62" fill="#F7941D" font-size="24" font-weight="bold">$142,850.00</text>
    <text x="253" y="85" fill="#0CCE6B" font-size="11" font-weight="bold">↑ 104% to target</text>

    <!-- KPI 3 -->
    <rect x="470" y="0" width="215" height="100" rx="8" fill="url(#cardGrad)" stroke="#252B3A" stroke-width="1" />
    <text x="488" y="28" fill="#8B949E" font-size="12">Conversion Rate</text>
    <text x="488" y="62" fill="#FFFFFF" font-size="24" font-weight="bold">4.82%</text>
    <text x="488" y="85" fill="#0CCE6B" font-size="11" font-weight="bold">↑ +1.4% industry avg</text>

    <!-- KPI 4 -->
    <rect x="705" y="0" width="225" height="100" rx="8" fill="url(#cardGrad)" stroke="#252B3A" stroke-width="1" />
    <text x="723" y="28" fill="#8B949E" font-size="12">Avg Order Value (AOV)</text>
    <text x="723" y="62" fill="#FFFFFF" font-size="24" font-weight="bold">$194.20</text>
    <text x="723" y="85" fill="#0CCE6B" font-size="11" font-weight="bold">↑ +$22.50 cross-sells</text>

    <!-- Sales Chart & Live Stream Split -->
    <!-- Sales Graph Box -->
    <rect x="0" y="120" width="570" height="270" rx="8" fill="url(#cardGrad)" stroke="#252B3A" stroke-width="1" />
    <text x="20" y="148" fill="#FFFFFF" font-size="14" font-weight="bold">Hourly Sales Volume • Next.js Edge Cache Enabled</text>
    <text x="460" y="148" fill="#8B949E" font-size="12">Live 24h Stream</text>
    
    <!-- Grid lines -->
