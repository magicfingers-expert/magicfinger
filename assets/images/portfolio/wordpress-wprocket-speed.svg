<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
      <rect width="1200" height="800" fill="#1E2327"/>
      <!-- Top WP Admin Bar -->
      <rect width="1200" height="36" fill="#1D2327"/>
      <circle cx="20" cy="18" r="10" fill="#FFF"/>
      <text x="20" y="22" font-family="sans-serif" font-size="12" font-weight="900" fill="#1D2327" text-anchor="middle">W</text>
      <text x="45" y="22" font-family="sans-serif" font-size="12" fill="#CCC">Client Production Store</text>
      <text x="1120" y="22" font-family="sans-serif" font-size="12" fill="#CCC">Howdy, Admin</text>

      <!-- WP Sidebar -->
      <rect y="36" width="200" height="764" fill="#1D2327"/>
      <g transform="translate(20, 75)" font-family="sans-serif" font-size="13" fill="#C3C4C7">
        <text x="0" y="0">📊 Dashboard</text>
        <text x="0" y="35">🛒 WooCommerce</text>
        <text x="0" y="70">📦 Products (4,820)</text>
        <text x="0" y="105">🔌 Plugins (14)</text>
        <rect x="-10" y="125" width="190" height="30" rx="3" fill="#2271B1"/>
        <text x="0" y="145" fill="#FFF" font-weight="700">🚀 WP Rocket</text>
        <text x="0" y="180">⚡ Redis Object Cache</text>
      </g>

      <!-- Main Panel -->
      <g transform="translate(230, 60)">
        <rect width="930" height="700" rx="6" fill="#F0F0F1"/>
        
        <rect width="930" height="70" fill="#222" rx="6 6 0 0"/>
        <text x="30" y="44" font-family="sans-serif" font-size="22" font-weight="800" fill="#F7941D">🚀 WP ROCKET PRO &amp; REDIS OPTIMIZATION</text>

        <!-- Status Card -->
        <g transform="translate(30, 95)">
          <rect width="870" height="90" rx="6" fill="#FFF" stroke="#CCD0D4"/>
          <circle cx="35" cy="45" r="14" fill="#00A32A"/>
          <text x="35" y="51" font-family="sans-serif" font-size="16" fill="#FFF" text-anchor="middle">✓</text>
          <text x="65" y="38" font-family="sans-serif" font-size="16" font-weight="700" fill="#1D2327">Cache Status: Active &amp; Serving High-Speed Pages</text>
          <text x="65" y="62" font-family="sans-serif" font-size="13" fill="#50575E">In-Memory Redis Cache: 18,420 cached queries • 99.4% Hit Rate • 0ms DB Query Delay</text>
        </g>

        <!-- Options Grid -->
        <g transform="translate(30, 210)">
          <rect width="420" height="380" rx="6" fill="#FFF" stroke="#CCD0D4"/>
          <text x="25" y="35" font-family="sans-serif" font-size="16" font-weight="700" fill="#1D2327">File Optimization Settings</text>
          
          <g transform="translate(25, 60)" font-family="sans-serif" font-size="13" fill="#2C3338">
            <text x="0" y="25" fill="#00A32A">● Minify CSS Files: <tspan font-weight="700">ENABLED</tspan></text>
            <text x="0" y="65" fill="#00A32A">● Combine CSS Files: <tspan font-weight="700">ENABLED</tspan></text>
            <text x="0" y="105" fill="#00A32A">● Load JavaScript Deferred: <tspan font-weight="700">ENABLED</tspan></text>
            <text x="0" y="145" fill="#00A32A">● Generate Critical Path CSS: <tspan font-weight="700">ENABLED</tspan></text>
            <text x="0" y="185" fill="#00A32A">● Delay Non-Essential JS: <tspan font-weight="700">ACTIVE</tspan></text>
          </g>

          <g transform="translate(450, 0)">
            <rect width="420" height="380" rx="6" fill="#FFF" stroke="#CCD0D4"/>
            <text x="25" y="35" font-family="sans-serif" font-size="16" font-weight="700" fill="#1D2327">Media &amp; Database Tuning</text>
            
            <g transform="translate(25, 60)" font-family="sans-serif" font-size="13" fill="#2C3338">
              <text x="0" y="25" fill="#00A32A">● Image LazyLoad: <tspan font-weight="700">ACTIVE</tspan></text>
              <text x="0" y="65" fill="#00A32A">● WebP Next-Gen Image Conversion: <tspan font-weight="700">ACTIVE</tspan></text>
              <text x="0" y="105" fill="#00A32A">● Automatic DB Transients Cleanup: <tspan font-weight="700">0 OVERHEAD</tspan></text>
              <text x="0" y="145" fill="#00A32A">● WooCommerce Cart Fragments: <tspan font-weight="700">CACHED</tspan></text>
              <text x="0" y="185" fill="#00A32A">● Cloudflare API Edge Integration: <tspan font-weight="700">CONNECTED</tspan></text>
            </g>
          </g>
        </g>
      </g>
    </svg>