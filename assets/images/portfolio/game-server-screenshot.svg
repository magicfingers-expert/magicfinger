      <text x="0" y="168" fill="#8B9BAE">[14:48:22 INFO]:</text> <text x="135" y="168" fill="#FDE8B3">[MagicFinger]</text> <text x="245" y="168" fill="#FDE8B3">Cluster performance status: OPTIMAL • 20.00 TPS STABLE</text>

